# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked

      - name: Run unittest
        shell: bash
        # run: python -m unittest discover -s ./tests  -p 'test_*.py'
        run: uv run --locked coverage run -m unittest discover -s ./tests -p 'test*.py'

      - name: Statistics
        if: success()
        run: |
          uv run --locked coverage report -i
          uv run --locked coverage xml -i

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: longxingtan/open-retrievals

  docs:
    name: Test docs build
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          uv sync --locked --group docs
      - name: Build sphinx documentation
        run: make docs

      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-results-${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.requires }}
          path: docs/build/html/
        # Use always() to always run this step to publish test results when there are test failures
        if: success()

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Build and install wheel into a clean environment
        run: |
          uv build --wheel
          uv venv /tmp/retrievals-wheel
          uv pip install --python /tmp/retrievals-wheel/bin/python dist/*.whl
          cp scripts/smoke_installed.py /tmp/smoke_installed.py
      - name: Test packaged YAML workflows outside checkout
        working-directory: /tmp
        run: PATH=/tmp/retrievals-wheel/bin:$PATH /tmp/retrievals-wheel/bin/python /tmp/smoke_installed.py
