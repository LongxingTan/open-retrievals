name: Lint

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  linter-black:
      name: Check code formatting with Black
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Set up Python 3.10
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'
        - name: Install Black
          uses: astral-sh/setup-uv@v6
        - name: Run Black
          run: uv run --locked black --check .

  imports-check-isort:
    name: Check valid import formatting with isort
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install isort
        uses: astral-sh/setup-uv@v6
      - name: Run isort
        run: uv run --locked isort --check-only --diff .

  linter-flake8:
    name: Check valid formatting with flake8
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        uses: astral-sh/setup-uv@v6
      - name: Run checks
        run: uv run --locked flake8

  pre-commit-hooks:
    name: Check that pre-commit hooks pass
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        uses: astral-sh/setup-uv@v6

      - name: Run checks
        run: uv run --locked pre-commit run --all-files
